
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Mi tarjeta | Rick's Barber Shop</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      background: #1d1d1d;
      border: 1px solid #383838;
      border-radius: 20px;
      text-align: center;
    }

    .logo {
      width: 110px;
      height: 110px;
      object-fit: contain;
      margin-bottom: 12px;
    }

    h1 {
      margin: 8px 0;
      font-size: 27px;
    }

    .subtitle {
      color: #bdbdbd;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    form {
      text-align: left;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #555;
      border-radius: 10px;
      background: #292929;
      color: white;
      font: inherit;
    }

    input:focus {
      outline: 2px solid #c6a66a;
      outline-offset: 2px;
    }

    button,
    .wallet-link {
      display: block;
      width: 100%;
      margin-top: 24px;
      padding: 16px;
      border: 0;
      border-radius: 10px;
      background: #c6a66a;
      color: #111;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    button:disabled {
      opacity: .65;
      cursor: wait;
    }

    .wallet-link {
      background: #fff;
      margin-top: 16px;
    }

    .hidden {
      display: none;
    }

    .message {
      margin-top: 18px;
      line-height: 1.5;
      font-size: 14px;
    }

    .error {
      color: #ffaaaa;
    }

    .success {
      color: #a8e6b0;
    }

    .footer {
      margin-top: 26px;
      color: #999;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="card">
    <img
      class="logo"
      src="assets/logo.png"
      alt="Rick's Barber Shop"
    >

    <h1>Tu tarjeta de fidelidad</h1>

    <p class="subtitle">
      ¡Cada corte cuenta! Acumula 5 visitas
      y consigue un corte gratis.
    </p>

    <form id="walletForm">
      <label for="customerName">Nombre completo</label>
      <input
        id="customerName"
        name="name"
        type="text"
        autocomplete="name"
        maxlength="100"
        placeholder="Tu nombre"
        required
      >

      <label for="customerPhone">Número de teléfono</label>
      <input
        id="customerPhone"
        name="phone"
        type="tel"
        inputmode="tel"
        autocomplete="tel"
        maxlength="25"
        placeholder="667 123 4567"
        required
      >

      <button id="submitButton" type="submit">
        Obtener mi tarjeta
      </button>
    </form>

    <p
      id="message"
      class="message"
      role="status"
      aria-live="polite"
    ></p>

    <div id="walletResult" class="hidden">
      <a
        id="googleWalletLink"
        class="wallet-link"
        href="#"
        rel="noopener noreferrer"
      >
        Guardar en Google Wallet
      </a>
    </div>

    <p class="footer">
      Rick's Barber Shop · Programa de fidelidad
    </p>
  </main>

  <script type="module" src="js/mi-tarjeta.js"></script>
</body>
</html>
