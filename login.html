
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Rick's Barber Shop | Iniciar sesión</title>

    <style>
        :root {
            --brand: #850817;
            --brand-dark: #650611;
            --brand-hover: #9b1021;
            --background: #f4f5f5;
            --text: #202124;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--background);
            font-family: Inter, Arial, sans-serif;
            color: var(--text);
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 38px;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 18px 55px rgba(67, 3, 10, .10);
        }

        .login-logo {
            display: block;
            width: 130px;
            height: 130px;
            object-fit: contain;
            margin: 0 auto 22px;
        }

        h1 {
            text-align: center;
            font-size: 25px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #707276;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #e2e3e3;
            border-radius: 9px;
            outline: none;
            font: inherit;
        }

        input:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(133, 8, 23, .10);
        }

        button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 9px;
            background: var(--brand);
            color: white;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: background .2s;
        }

        button:hover {
            background: var(--brand-hover);
        }

        button:disabled {
            opacity: .6;
            cursor: wait;
        }

        .error {
            min-height: 20px;
            margin-top: 16px;
            color: #b84a4a;
            text-align: center;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <main class="login-card">
        <img
            src="assets/logo.png"
            alt="Rick's Barber Shop"
            class="login-logo"
        >

        <h1>Panel administrativo</h1>

        <p class="subtitle">
            Ingresa para administrar Rick's Barber Shop
        </p>

        <form id="loginForm">
            <div class="field">
                <label for="email">Correo electrónico</label>

                <input
                    id="email"
                    type="email"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="field">
                <label for="password">Contraseña</label>

                <input
                    id="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button id="loginButton" type="submit">
                Iniciar sesión
            </button>

            <p
                id="loginError"
                class="error"
                role="alert"
                aria-live="polite"
            ></p>
        </form>
    </main>

    <script type="module">
        import {
            loginAdmin,
            requireAdmin
        } from "./js/auth.js";

        import { auth } from "./js/firebase.js";

        const form = document.getElementById("loginForm");
        const button = document.getElementById("loginButton");
        const errorElement = document.getElementById("loginError");

        form.addEventListener("submit", async event => {
            event.preventDefault();

            button.disabled = true;
            button.textContent = "Verificando...";
            errorElement.textContent = "";

            try {
                const email = document
                    .getElementById("email").value.trim();

                const password = document
                    .getElementById("password").value;

                await loginAdmin(email, password);

                window.location.replace("index.html");
            } catch (error) {
    console.error("Firebase login error:", error);

    const messages = {
        "auth/invalid-credential":
            "Correo o contraseña incorrectos.",

        "auth/invalid-email":
            "El correo electrónico no es válido.",

        "auth/user-disabled":
            "Esta cuenta está deshabilitada.",

        "auth/operation-not-allowed":
            "Debes activar Email/Password en Firebase Authentication.",

        "auth/too-many-requests":
            "Demasiados intentos. Intenta más tarde.",

        "permission-denied":
            "Firestore rechazó el acceso. Revisa las reglas y el documento admins.",

        "unavailable":
            "No se pudo conectar con Firestore."
    };

    errorElement.textContent =
        messages[error.code] ||
        error.message ||
        "No fue posible iniciar sesión.";
}finally {
                button.disabled = false;
                button.textContent = "Iniciar sesión";
            }
        });

        // Si ya existe una sesión, verificar si puede entrar.
        auth.authStateReady().then(async () => {
            if (auth.currentUser) {
                await requireAdmin();

                if (auth.currentUser) {
                    window.location.replace("index.html");
                }
            }
        }).catch(error => {
            console.error("Error revisando sesión:", error);
        });
    </script>
</body>
</html>
